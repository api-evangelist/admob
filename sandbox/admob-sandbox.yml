notes: >-
  AdMob has no sandbox for the REST management/reporting API — admob.googleapis.com
  has a single live environment, no test-vs-live key prefixes and no test mode;
  calls always read the caller's real AdMob account. The sandbox surface AdMob
  publishes is on the publisher-integration side: a permanent set of Google-owned
  demo ad unit IDs that always return test ads, plus a test-device mechanism for
  requesting test ads against your own ad units. Every value below is published
  verbatim by Google; none is invented.
api_sandbox:
  available: false
  detail: No sandbox host, no test-mode credentials, no test/live key separation for the AdMob API.
test_mode:
  mechanisms:
  - name: Demo ad units
    detail: >-
      Google-owned ad unit IDs that always serve test ads and are safe to hard-code
      during development. All share the publisher prefix ca-app-pub-3940256099942544.
  - name: Test devices
    detail: >-
      Register a device so your own ad units serve test ads. Programmatically via
      RequestConfiguration.Builder.setTestDeviceIds(...) using the device ID printed
      to the log, or through the AdMob UI (takes 15 minutes to 24 hours to take
      effect). Android emulators are automatically treated as test devices.

generated: '2026-08-12'
method: searched
source: https://developers.google.com/admob/api/v1/libraries
notes: >-
  Two distinct first-party package families. (1) AdMob API client libraries —
  the REST/JSON management + reporting API at admob.googleapis.com is reached
  through Google's generated per-API clients (@googleapis/admob) and the
  aggregate Google API clients (googleapis, google-api-python-client,
  google/apiclient, google-api-go-client, google-apis-admob_v1). (2) Google
  Mobile Ads SDK — the publisher-side ad rendering SDK apps embed to actually
  serve AdMob inventory. Versions and publish dates were read from each
  registry's metadata endpoint on 2026-08-12.
